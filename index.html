<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1F3A">
<title>Disciplina BC Trades</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--sf:#F4F6FA;--sf2:#E8EDF4;--ln:#E3E8F0;--ln2:#A9B5C6;--track:#E3E8F0;--ink:#0B1F3A;--mu:#56677F;--ac:#1F5FE0;--act:#1F5FE0;--acs:#E8EFFD;--ok:#1E7A4C;--oks:#E4F2EA;--er:#B4483F;--ers:#F8ECEA;--erLn:#EBC9C5;--hero:#0B1F3A;--heroLn:#0B1F3A;--okHero:#2E9461;--erHero:#C9655C;--dis:#E3E8F0;--disInk:#56677F;--fin:#0B1F3A;--finCard:rgba(255,255,255,0.08);--finRing:rgba(255,255,255,0.12);
 color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08131F;--sf:#0F1E31;--sf2:#1C2E47;--ln:#1C2E47;--ln2:#4A6185;--track:#1C2E47;--ink:#EEF2F8;--mu:#9AAAC0;--ac:#2F66E8;--act:#86A9FF;--acs:#14274A;--ok:#4CC48A;--oks:#0F2E22;--er:#E58A80;--ers:#33191C;--erLn:#5A2A2E;--hero:#10264A;--heroLn:#21406E;--dis:#1C2E47;--disInk:#9AAAC0;--fin:#08131F;--finCard:#10264A;--finRing:rgba(134,169,255,0.18);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#08131F;--sf:#0F1E31;--sf2:#1C2E47;--ln:#1C2E47;--ln2:#4A6185;--track:#1C2E47;--ink:#EEF2F8;--mu:#9AAAC0;--ac:#2F66E8;--act:#86A9FF;--acs:#14274A;--ok:#4CC48A;--oks:#0F2E22;--er:#E58A80;--ers:#33191C;--erLn:#5A2A2E;--hero:#10264A;--heroLn:#21406E;--dis:#1C2E47;--disInk:#9AAAC0;--fin:#08131F;--finCard:#10264A;--finRing:rgba(134,169,255,0.18);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.4}
main{max-width:480px;margin:0 auto;padding:20px 20px 110px;display:flex;flex-direction:column;gap:14px}
body.sin-nav main{padding-bottom:24px}
body.sin-nav nav{display:none}
h1{margin:0;font-size:28px;line-height:34px;font-weight:800;letter-spacing:-.02em}
h1.h2{font-size:22px;line-height:28px;letter-spacing:-.01em}
h2{margin:0;font-size:15px;font-weight:800}
p{margin:0}
.sub{font-size:13px;font-weight:600;color:var(--mu)}
.mu{color:var(--mu);font-weight:600}.sm{font-size:13px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:12px}.logo{width:52px;height:45px;object-fit:contain;flex-shrink:0}.logo-s{width:44px;height:38px;object-fit:contain;margin-left:auto;align-self:flex-start}.logo-fin{width:104px;height:95px;object-fit:contain;margin-bottom:-6px}
.chip{display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;background:var(--acs);color:var(--act);font-size:13px;font-weight:700;white-space:nowrap}
.hero{background:var(--hero);border:1px solid var(--heroLn);border-radius:20px;padding:18px 18px 16px;color:#fff;display:flex;flex-direction:column;gap:14px}
.hrow{display:flex;align-items:center;gap:16px}
.hicon{width:64px;height:64px;border-radius:32px;background:rgba(255,255,255,.10);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hnum{flex:1;display:flex;flex-direction:column}
.hnum div{display:flex;align-items:baseline;gap:8px}
.hnum b{font-size:56px;line-height:56px;font-weight:800;letter-spacing:-.03em}
.hnum div span{font-size:17px;font-weight:700}
.hnum p,.hero p{font-size:14px;font-weight:500;color:rgba(255,255,255,.8)}
.hrec{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.hrec span{font-size:12px;font-weight:600;color:rgba(255,255,255,.72)}.hrec b{font-size:17px;font-weight:800}
.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.wcol{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;color:rgba(255,255,255,.78)}
.wd{width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;color:#fff}
.wd.ok{background:var(--okHero)}.wd.ko{background:var(--erHero)}
.wd.hoy{border:2.5px solid #fff;font-size:11px;font-weight:800}
.wd.vacio{border:1.5px dashed rgba(255,255,255,.45)}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;font-weight:600;color:rgba(255,255,255,.78)}
.leg span{display:flex;align-items:center;gap:6px}.leg i{width:10px;height:10px;border-radius:5px}
.lok{background:var(--okHero)}.lko{background:var(--erHero)}.lva{border:1.5px dashed rgba(255,255,255,.6)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.nivel b{font-size:15px;font-weight:800}.nivel .mu{font-size:13px}
.track{height:10px;border-radius:5px;background:var(--track);overflow:hidden}
.track i{display:block;height:100%;border-radius:5px;background:var(--ac);transition:width .3s}
.nlabels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));font-size:11px;font-weight:600;color:var(--mu)}
.nlabels span:nth-child(3){text-align:center}.nlabels span:nth-child(4){text-align:right}
.nlabels .on{color:var(--act);font-weight:800}
.acciones{display:flex;flex-direction:column;gap:10px}
.dos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.btn{font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;cursor:pointer;border-radius:14px;font-weight:700;font-size:15px;height:52px;padding:0 10px;text-align:center;line-height:1.15}
.btn.primary{height:56px;border-radius:16px;border:0;background:var(--ac);color:#fff;font-size:17px;font-weight:800}
.btn.primary:disabled,.btn.primary.off{background:var(--dis);color:var(--disInk)}
.btn.sec{border:1.5px solid var(--ln2);background:var(--bg);color:var(--ink)}
.btn.panic{border:1.5px solid var(--er);background:var(--ers);color:var(--er)}
button:focus-visible,input:focus-visible{outline:3px solid var(--act);outline-offset:2px}
.ops{display:flex;flex-direction:column;gap:8px}
.op{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;border:1px solid var(--ln)}
.op .bar{width:8px;height:36px;border-radius:4px;flex-shrink:0}.bar.ac{background:var(--ac)}.bar.ok{background:var(--ok)}.bar.er{background:var(--er)}
.opt{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}
.opt b{font-size:15px;font-weight:800}.opt span{font-size:12px;font-weight:600;color:var(--mu)}
.mini{height:44px;padding:0 16px;border-radius:12px;border:0;background:var(--acs);color:var(--act);font-family:inherit;font-size:14px;font-weight:800;cursor:pointer}
.badge{min-height:28px;padding:4px 10px;border-radius:14px;display:flex;align-items:center;gap:4px;font-size:12px;font-weight:800;text-align:right;max-width:46%}
.badge.ok{background:var(--oks);color:var(--ok)}.badge.er{background:var(--ers);color:var(--er)}
.vacio-t{font-size:14px;font-weight:600;color:var(--mu);padding:6px 2px}
.back{display:flex;align-items:center;gap:8px;margin-left:-10px}
.ib{width:44px;height:44px;border-radius:22px;border:0;background:none;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;border-radius:14px;background:var(--sf);border:1px solid var(--ln)}
.seg button{min-height:48px;padding:6px 8px;border-radius:11px;border:0;background:transparent;color:var(--mu);font-family:inherit;font-size:13px;line-height:17px;font-weight:800;cursor:pointer}
.seg button.on{background:var(--ac);color:#fff}
.prog{display:flex;flex-direction:column;gap:6px}.prog .track{height:8px}
.items{display:flex;flex-direction:column;gap:8px}
.grp{margin:8px 0 0;font-size:13px;color:var(--mu)}
.item{min-height:64px;padding:12px 14px;border-radius:14px;background:var(--bg);border:1.5px solid var(--ln);color:var(--ink);font-family:inherit;text-align:left;display:flex;align-items:flex-start;gap:12px;cursor:pointer;font-size:15px;line-height:21px;font-weight:600}
.item.on{border-color:var(--ac);background:var(--acs)}
.item .box{width:26px;height:26px;flex-shrink:0;border-radius:8px;border:2px solid var(--ln2);display:flex;align-items:center;justify-content:center;color:#fff}
.item.on .box{background:var(--ac);border-color:var(--ac)}
.form{gap:12px}
.lbl{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:var(--mu)}
.lbl.er{color:var(--er)}
.field{height:52px;border-radius:12px;border:1.5px solid var(--ln2);background:var(--bg);display:flex;align-items:center;padding:0 12px;gap:4px}
.field.er{border:2px solid var(--er);background:var(--ers)}
.field input{width:100%;min-width:0;border:0;outline:none;background:transparent;color:var(--ink);font-family:inherit;font-size:18px;font-weight:800;padding:0}
.field input::placeholder{color:var(--mu);font-weight:600;opacity:.6}
.field em{font-style:normal;font-size:15px;font-weight:700;color:var(--mu)}
.field:focus-within{border-color:var(--ac)}
.tres{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.alerta{display:flex;gap:12px;padding:12px 14px;border-radius:14px;background:var(--ers);border:1px solid var(--erLn);color:var(--er)}
.alerta[hidden]{display:none}
.alerta svg{flex-shrink:0}.alerta div{display:flex;flex-direction:column;gap:2px}
.alerta b{font-size:15px;font-weight:800}.alerta span{font-size:13px;line-height:18px;font-weight:600;color:var(--ink)}
.revision{display:flex;flex-direction:column}.revision h2{margin-bottom:4px}
.q{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--ln)}
.q>span{flex:1;font-size:15px;font-weight:700}
.q div{display:flex;gap:6px}
.q button{width:60px;height:44px;border-radius:12px;border:1.5px solid var(--ln2);background:var(--bg);color:var(--ink);font-family:inherit;font-size:15px;font-weight:800;cursor:pointer}
.q button.on.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.q button.on.er{background:var(--er);border-color:var(--er);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{max-width:100%;white-space:normal;font-family:inherit;font-size:13px;line-height:17px;font-weight:600;padding:8px 12px;border-radius:12px;border:1.5px solid var(--ln2);background:var(--bg);color:var(--ink);text-align:left;cursor:pointer;height:auto}
.chip.on{background:var(--ers);border-color:var(--er);color:var(--er)}
.barra{position:sticky;z-index:4;bottom:var(--navh,84px);margin:4px -20px 0;padding:12px 20px;background:var(--bg);border-top:1px solid var(--ln);display:flex;flex-direction:column;gap:8px}
.nota{text-align:center;font-size:13px;font-weight:700;color:var(--mu)}.nota.ok{color:var(--ok)}
body.modo-fin{background:var(--fin)}
body.modo-fin main{min-height:100vh;justify-content:center}
.fin{display:flex;flex-direction:column;align-items:center;gap:26px;text-align:center;color:#fff;padding:20px 4px}
.ring{width:96px;height:96px;border-radius:48px;background:var(--finRing);display:flex;align-items:center;justify-content:center}
.ring div{width:80px;height:80px;border-radius:40px;background:#fff;color:var(--fin);display:flex;align-items:center;justify-content:center}
.fin h1{font-size:32px;line-height:38px}
.fin .big{font-size:19px;line-height:27px;font-weight:600;color:rgba(255,255,255,.86);margin-top:12px}
.fin .small{font-size:14px;font-weight:600;color:rgba(255,255,255,.72);margin-top:8px}
.stats3{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats3 div{padding:14px 6px;border-radius:16px;background:var(--finCard);display:flex;flex-direction:column;gap:2px}
.stats3 b{font-size:24px;font-weight:800}.stats3 span{font-size:12px;font-weight:600;color:rgba(255,255,255,.78)}
.pill{display:flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:20px;border:1px solid rgba(255,255,255,.28);font-size:14px;font-weight:700;color:rgba(255,255,255,.9)}
.link{min-height:44px;background:none;border:0;color:#fff;font-family:inherit;font-size:15px;font-weight:800;text-decoration:underline;text-underline-offset:4px;cursor:pointer}
.hero.liga{padding:16px 18px;gap:12px}
.hdiv{display:flex;flex-direction:column;gap:2px}.hdiv span{font-size:13px;font-weight:600;color:rgba(255,255,255,.78)}
.hdiv h1{font-size:34px;line-height:38px}
.divbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.divbar i{height:6px;border-radius:3px;background:rgba(255,255,255,.18)}
.divbar i.past{background:rgba(255,255,255,.5)}.divbar i.cur{background:#fff}
.divbar span{font-size:11px;font-weight:600;color:rgba(255,255,255,.72)}.divbar span.cur{font-weight:800;color:#fff}
.hero.liga p{font-size:12px;line-height:17px;font-weight:600}
.rank{display:flex;flex-direction:column;gap:4px}
.zona{display:flex;align-items:center;gap:8px;padding:6px 4px 2px;font-size:12px;font-weight:800;letter-spacing:.02em}
.zona i{flex:1;border-top:1.5px dashed currentColor;opacity:.6}
.zona.up{color:var(--ok)}.zona.down{color:var(--er)}.zona.mid{color:var(--ln2)}
.rrow{display:flex;align-items:center;gap:12px;min-height:48px;padding:6px 12px;border-radius:12px;border:2px solid transparent}
.rrow.me{background:var(--acs);border-color:var(--ac)}
.rrow .pos{width:22px;font-size:15px;font-weight:800;text-align:right;color:var(--mu)}
.rrow.up .pos{color:var(--ok)}.rrow.down .pos{color:var(--er)}
.av{width:30px;height:30px;border-radius:15px;background:var(--sf2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.nm{flex:1;display:flex;flex-direction:column;min-width:0;font-size:15px}
.nm b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nm small{font-weight:600;color:var(--mu)}
.nm em{font-style:normal;font-size:11px;font-weight:700;color:var(--act)}
.pd{font-size:15px;font-weight:800;white-space:nowrap}.pd small{font-size:11px;color:var(--mu)}
.hero.inf>span{font-size:13px;font-weight:700;color:rgba(255,255,255,.78)}
.hero.inf .hnum b{font-size:44px;line-height:48px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.st{gap:2px}.st b{font-size:22px;font-weight:800}.st b.ok{color:var(--ok)}.st b.er{color:var(--er)}.st span{font-size:12px;font-weight:600;color:var(--mu)}
.esc{display:flex;gap:4px}.esc i{display:flex;color:rgba(255,255,255,.35)}.esc i.on{color:#fff}
.cuentas{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.cuentas button{flex:1 0 auto;min-width:140px;text-align:left;padding:10px 12px;border-radius:14px;border:1.5px solid var(--ln);background:var(--bg);color:var(--ink);font-family:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.cuentas button b{font-size:14px;font-weight:800}.cuentas button span{font-size:12px;font-weight:600;color:var(--mu)}
.cuentas button.on{border-color:var(--ac);background:var(--acs)}
.cta-card{border:1px solid var(--ln);background:var(--bg);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.cta-card b{font-size:14px;font-weight:800}
.del{background:none;border:0;color:var(--er);font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;min-height:36px}
.login-box{display:flex;flex-direction:column;gap:14px;align-items:stretch;text-align:center;color:#fff;padding-top:20px}
.login-box .logo-fin{align-self:center}.login-box .sub{color:rgba(255,255,255,.75)}
.login-box .card{text-align:left;background:var(--bg);color:var(--ink)}
body.sin-nav nav{display:none}body.sin-nav main{padding-bottom:30px}
.medals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:4px}
.medal{background:var(--bg);border:1px solid var(--ln);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px}
.medal .mi{width:44px;height:44px;border-radius:22px;background:var(--sf2);color:var(--mu);display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.medal.got .mi{background:var(--ac);color:#fff}
.medal b{font-size:14px;font-weight:800;line-height:1.25}.medal>span{font-size:12px;font-weight:600;color:var(--mu);line-height:1.3}
.medal em{font-style:normal;font-size:12px;font-weight:800;color:var(--ok)}.medal em.mu{color:var(--mu);font-weight:700}
.medal .track{height:6px;margin-top:4px}
.frow{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--ln);font-size:14px;font-weight:600}
.frow b{color:var(--er)}.frow.top span{font-weight:800}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--ln);padding:6px 8px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
#nav{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
nav button.ent{color:var(--act);font-weight:800}
nav button.ent span{background:var(--ac);color:#fff;width:56px;height:34px;border-radius:17px}
nav button.ent.on span{background:var(--ac);box-shadow:0 0 0 3px var(--acs)}
body.modo-fin nav button.ent span{background:rgba(255,255,255,.14)}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--mu);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;padding:4px 0}
nav button span{width:52px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
nav button.on{color:var(--act);font-weight:800}nav button.on span{background:var(--acs)}
body.modo-fin nav{background:var(--fin);border-top-color:rgba(255,255,255,.12)}
body.modo-fin nav button{color:rgba(255,255,255,.74)}body.modo-fin nav button.on{color:#fff}body.modo-fin nav button.on span{background:rgba(255,255,255,.14)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:700;z-index:9;transition:opacity .3s;max-width:90%;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.modal{position:fixed;inset:0;background:rgba(8,19,31,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.mbox{width:100%;max-width:440px;background:var(--bg);color:var(--ink);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--ln)}
.mbox h2{font-size:19px}.mbox p{font-size:15px;line-height:1.45;color:var(--mu);font-weight:600}
.mbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
</style>
</head>
<body>
<main id="app"></main>
<nav aria-label="Navegación principal"><div id="nav"></div></nav>
<script>

const KEY='bct-disciplina-v1';
window.addEventListener('error',e=>{try{toast('Error: '+(e.message||'desconocido'))}catch(_){}});

const DEF={settings:{riesgoMax:1,stopsMax:2,nombre:''},xp:0,days:{},open:null};
const TIPOS={propio:'Capital propio',fondeo:'Cuenta de fondeo'};
function cuentas(){const st=S.settings;if(!Array.isArray(st.cuentas)||!st.cuentas.length)st.cuentas=[{id:'c1',nombre:'Mi cuenta',tipo:'propio',riesgo:st.riesgoMax||1}];return st.cuentas}
function cuentaDe(id){const cs=cuentas();return cs.find(c=>c.id===id)||cs[0]}
function riesgoDe(id){return id?(cuentaDe(id).riesgo||S.settings.riesgoMax):Math.max(...cuentas().map(c=>c.riesgo||0))}
const fmtN=v=>String(v).replace('.',',');
function normaliza(x){x=x?JSON.parse(JSON.stringify(x)):{};const n=Object.assign(JSON.parse(JSON.stringify(DEF)),x);n.settings=Object.assign({},DEF.settings,n.settings||{});return n}
let S;
try{S=normaliza(JSON.parse(localStorage.getItem(KEY)))}catch(e){S=normaliza(null)}
let DB=null,ME=null,ligaDocs=[],ligaCargada=false,pend=false,escribiendo=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(DB){pend=true;flush()}}
async function flush(){if(escribiendo||!pend)return;escribiendo=true;pend=false;
  try{const {error}=await DB.from('estados').upsert({user_id:ME.id,estado:JSON.parse(JSON.stringify(S)),updated_at:new Date().toISOString()});if(error)throw error;await actualizarLiga()}catch(e){console.warn(e);toast('No se ha podido guardar en la nube. Se reintentará.');pend=true;setTimeout(flush,8000)}
  escribiendo=false;if(pend)setTimeout(flush,400)}
const conTiempo=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),ms||10000))]);

const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dkey(new Date());
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function day(k){k=k||today();if(!S.days[k])S.days[k]={trades:[],closed:false,mode:null};return S.days[k]}

function comunes(){return['Fuera de la ventana de noticias (1 h antes, 30 a 45 min después)',
  'Riesgo fijado (máximo '+fmtN(riesgoDe(draft&&draft.cuenta))+' %) y stop puesto',
  'Hoy llevo menos de '+S.settings.stopsMax+' stops']}

const NIVELES=[[0,'Aprendiz'],[150,'Disciplinado'],[500,'Profesional'],[1200,'Fondeado']];
function nivel(){let i=0;NIVELES.forEach((n,j)=>{if(S.xp>=n[0])i=j});const cur=NIVELES[i],next=NIVELES[i+1];
  return{nombre:cur[1],pct:next?Math.round((S.xp-cur[0])/(next[0]-cur[0])*100):100,falta:next?next[0]-S.xp:0,next:next?next[1]:null}}

function fallosTrade(t){const f=[];
  if(!t.checklistOk)f.push('Saltarse el checklist');
  if(t.promedio)f.push('Promediar');
  if(t.movioStop)f.push('Mover el stop');
  if(t.riesgo>riesgoDe(t.cuenta))f.push('Sobreloteo');
  return f}
function estadoDia(k){const d=S.days[k];if(!d)return'vacio';
  if(d.trades.some(t=>fallosTrade(t).length))return'roto';
  if(d.closed)return'limpio';
  return d.trades.length?'encurso':'vacio'}
function racha(){let n=0;const d=new Date();
  for(let i=0;i<400;i++){const wd=d.getDay();const k=dkey(d);
    if(wd!==0&&wd!==6){const e=estadoDia(k);
      if(e==='limpio')n++;
      else if(k!==today()&&(S.protegidos||[]).includes(k)){}
      else if(e==='roto')break;
      else if(k!==today())break;}
    d.setDate(d.getDate()-1)}
  return n}
function lunes(offset){const d=new Date();const wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd-7*offset);d.setHours(12);return d}
function sumaR(ts){return ts.reduce((a,t)=>a+(Number(t.r)||0),0)}
const fmtR=v=>(v>0?'+':'')+(Math.round(v*100)/100).toString().replace('.',',')+' R';

let view='hoy',step=null,draft={},tmp={},semana=0;
function addXP(n,msg){S.xp=Math.max(0,S.xp+n);const dd=day();dd.pts=(dd.pts||0)+n;save();toast((n>=0?'+':'')+n+' XP · '+msg)}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>{t.style.opacity=0;setTimeout(()=>t.remove(),300)},2200)}

function cerrarDia(mode){const d=day();if(d.closed)return;d.closed=true;d.mode=mode;save();
  const limpio=estadoDia(today())==='limpio';
  if(mode==='panico')addXP(limpio?25:15,'Parar a tiempo también es operar bien');
  else if(limpio)addXP(10,'Día limpio');
  else{save();toast('Día cerrado')}
  render()}

const DIVS=['Cuarzo','Ámbar','Zafiro','Diamante'];
const TOPE_DIA=40;
const wk=o=>dkey(lunes(o||0));
function wkMenos(W){const d=new Date(W+'T12:00:00');d.setDate(d.getDate()-7);return dkey(d)}
function ptsSemana(W){let t=0;const d0=new Date(W+'T12:00:00');
  for(let i=0;i<7;i++){const x=new Date(d0);x.setDate(d0.getDate()+i);const d=S.days[dkey(x)];if(d)t+=Math.min(TOPE_DIA,Math.max(0,d.pts||0))}return t}
function grupoDe(W,div,miHist){return ligaDocs.map(x=>x.id===ME.id?{id:x.id,h:miHist}:{id:x.id,h:x.hist||{}})
  .concat(ligaDocs.some(x=>x.id===ME.id)?[]:[{id:ME.id,h:miHist}])
  .filter(x=>x.h[W]&&x.h[W].div===div)}
function calcDiv(hist,W){const ks=Object.keys(hist).filter(k=>k<W).sort();if(!ks.length)return 0;
  const L=ks[ks.length-1],d0=hist[L].div;
  if(L!==wkMenos(W))return Math.max(0,d0-1);
  const ps=grupoDe(L,d0,hist).map(x=>x.h[L].pts||0),n=ps.length,k=Math.floor(n/4),mio=hist[L].pts||0;
  if(k>0&&mio>0&&ps.filter(p=>p>mio).length<k)return Math.min(3,d0+1);
  if(k>0&&ps.filter(p=>p<mio).length<k)return Math.max(0,d0-1);
  return d0}
async function actualizarLiga(){if(!DB)return;const W=wk(0);
  const mio=ligaDocs.find(x=>x.id===ME.id);const hist=JSON.parse(JSON.stringify((mio&&mio.hist)||{}));
  if(!hist[W])hist[W]={div:calcDiv(hist,W),pts:0};
  hist[W].pts=ptsSemana(W);
  const doc={hist,alias:(S.settings.nombre||'').slice(0,24),racha:racha()};
  const {error}=await DB.from('liga').upsert(Object.assign({user_id:ME.id,updated_at:new Date().toISOString()},doc));if(error)throw error;
  if(mio){mio.hist=hist;mio.alias=doc.alias;mio.racha=doc.racha}else ligaDocs.push(Object.assign({id:ME.id},doc))}

async function entrarConSesion(user){
  DB=sbCli;ME={id:user.id,email:user.email};
  try{const {data,error}=await conTiempo(DB.from('estados').select('estado').eq('user_id',user.id).maybeSingle());if(error)throw error;
    if(data&&data.estado&&Object.keys(data.estado).length){S=normaliza(data.estado);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
    else{S=normaliza(null);const r=await DB.from('estados').upsert({user_id:user.id,estado:JSON.parse(JSON.stringify(S))});if(r.error)throw r.error}
    await cargarLiga();await actualizarLiga();
  }catch(e){console.warn(e);toast('Problema de conexión. Revisa tu internet.')}
  if(view==='login')view='hoy';render()}
async function initNube(){
  if(!window.supabase||!window.supabase.createClient){authListo=true;render();return}
  sbCli=window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  const {data}=await sbCli.auth.getSession();authListo=true;
  if(data&&data.session)await entrarConSesion(data.session.user);else{view='login';render()}
  setInterval(()=>{if(DB&&view==='liga')cargarLiga().then(render).catch(()=>{})},60000)}
async function login(modo){
  const em=(document.getElementById('lEmail').value||'').trim(),pw=document.getElementById('lPass').value||'';
  if(!em||pw.length<6){toast('Pon tu email y una contraseña de al menos 6 caracteres');return}
  const btn=document.querySelector('[data-act="login"],[data-act="registro"]');
  const r=modo==='registro'?await sbCli.auth.signUp({email:em,password:pw}):await sbCli.auth.signInWithPassword({email:em,password:pw});
  if(r.error){toast(traducirError(r.error.message));return}
  if(!r.data.session){toast('Revisa tu email para confirmar la cuenta y luego entra');return}
  await entrarConSesion(r.data.session.user)}
function traducirError(m){m=String(m||'');if(/Invalid login/i.test(m))return 'Email o contraseña incorrectos';if(/already registered/i.test(m))return 'Ese email ya tiene cuenta. Pulsa Entrar';if(/rate limit/i.test(m))return 'Demasiados intentos. Espera unos minutos';if(/valid email|invalid.*email/i.test(m))return 'Ese email no es válido';return 'Error: '+m}
async function salir(){try{await sbCli.auth.signOut()}catch(e){}try{localStorage.removeItem(KEY)}catch(e){}

const ico=(n,sz,sw,extra)=>`<svg width="${sz||20}" height="${sz||20}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||2}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra||''}>${I[n]}</svg>`;
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const hora=t=>{if(!t)return'';const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())};
function fechaLarga(){const d=new Date();return cap(DIAS[d.getDay()])+', '+d.getDate()+' de '+MESES[d.getMonth()]}
function semanaISO(d){d=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-n);const y=new Date(Date.UTC(d.getUTCFullYear(),0,1));return Math.ceil(((d-y)/864e5+1)/7)}
function cierraEn(){const n=new Date(),f=new Date(lunes(0));f.setDate(f.getDate()+7);f.setHours(0,0,0,0);const ms=f-n,d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5);return d+' d '+h+' h'}
function navHTML(){const it=[['hoy','Hoy'],['liga','Liga'],['entrada',S.open?'Cierre':'Entrada'],['informe','Informe'],['ajustes','Ajustes']];
 const act=['operar','cierre'].includes(view)?'entrada':view;
 return it.map(([k,l])=>`<button type="button" data-tab="${k}" class="${k==='entrada'?'ent ':''}${act===k?'on':''}" ${act===k?'aria-current="page"':''}><span>${ico(k,22,k==='entrada'?2.6:2)}</span>${l}</button>`).join('')}

/* ---------- Vistas ---------- */
function vHoy(){
  const d=day(),k=today(),nv=nivel(),r=racha();
  if(r>(S.record||0)){S.record=r;save()}
  if(d.closed)return vTerminado(d,r);
  const stops=d.trades.filter(t=>Number(t.r)<0).length;
  const lu=lunes(0);let week='';
  ['L','M','X','J','V'].forEach((l,i)=>{const x=new Date(lu);x.setDate(lu.getDate()+i);const kk=dkey(x);const e=estadoDia(kk);
    let c;if(e==='limpio')c=`<span class="wd ok">${ico('check',20,2.8,'role="img" aria-label="Cumplido"')}</span>`;
    else if(e==='roto')c=`<span class="wd ko">${ico('x',18,2.8,'role="img" aria-label="Incumplido"')}</span>`;
    else if(kk===k)c=`<span class="wd hoy">HOY</span>`;else c=`<span class="wd vacio" aria-label="Sin registrar"></span>`;
    week+=`<div class="wcol"><span>${l}</span>${c}</div>`});
  const iN=NIVELES.findIndex(n=>n[1]===nv.nombre);
  let h=`<header class="top"><div class="brand"><img src="${LOGO}" alt="BC Trades" class="logo"><div><p class="sub">${fechaLarga()}</p><h1>Hoy</h1></div></div><span class="chip">${ico('escudo',16)}${nv.nombre}</span></header>
  <section class="hero" aria-label="Racha">
    <div class="hrow"><div class="hicon">${ico('escudoOk',34,1.8)}</div>
      <div class="hnum"><div><b>${r}</b><span>${r===1?'día':'días'}</span></div><p>${r?'cumpliendo tu plan sin fallar':'empieza tu racha hoy'}</p></div>
      <div class="hrec"><span>Récord</span><b>${S.record||0}</b><span style="margin-top:8px">Escudos</span><span class="esc" aria-label="${S.escudos||0} de 2 escudos">${[0,1].map(i=>`<i class="${i<(S.escudos||0)?'on':''}">${ico('escudo',16,2.2)}</i>`).join('')}</span></div></div>
    <div class="week">${week}</div>
    <div class="leg"><span><i class="lok"></i>Cumplido</span><span><i class="lko"></i>Incumplido</span><span><i class="lva"></i>Sin registrar</span></div>
  </section>
  <section class="card nivel" aria-label="Nivel"><div class="row"><b>Nivel ${iN+1} · ${nv.nombre}</b><span class="mu">${S.xp.toLocaleString('es-ES')}${nv.next?' / '+NIVELES[iN+1][0].toLocaleString('es-ES'):''} XP</span></div>
    <div class="track"><i style="width:${nv.pct}%"></i></div>
    <div class="nlabels">${NIVELES.map((n,i)=>`<span class="${i===iN?'on':''}">${n[1]}</span>`).join('')}</div></section>`;
  if(!S.open){
    h+=`<div class="acciones"><button type="button" class="btn primary" data-act="operar">Voy a operar ${ico('flecha',20,2.4)}</button>
    <div class="dos">${d.trades.length?`<button type="button" class="btn sec" data-act="cerrarDia">${ico('check',18)} Cerrar el día</button>`:`<button type="button" class="btn sec" data-act="sinSetup">${ico('menos',18)} Hoy no hay setup</button>`}
    <button type="button" class="btn panic" data-act="panico">${ico('stop',18)} Botón de pánico</button></div></div>`}
  h+=`<section aria-label="Operaciones de hoy" class="ops"><div class="row"><h2>Operaciones de hoy</h2><span class="mu sm">${Math.max(0,S.settings.stopsMax-stops)} de ${S.settings.stopsMax} stops disponibles</span></div>`;
  if(S.open){const o=S.open;h+=`<div class="op"><i class="bar ac"></i><div class="opt"><b>${esc(o.inst)} · ${o.dir}</b><span>${CL[o.op].nombre}${cuentas().length>1?' · '+esc(cuentaDe(o.cuenta).nombre):''} · ${hora(o.t)}</span></div><button type="button" class="mini" data-act="cerrarOp">Cerrar</button></div>`}
  if(!d.trades.length&&!S.open)h+=`<p class="vacio-t">Sin operaciones todavía. Si no hay setup, no operar también suma.</p>`;
  d.trades.slice().reverse().forEach(t=>{const f=fallosTrade(t);
    h+=`<div class="op"><i class="bar ${f.length?'er':'ok'}"></i><div class="opt"><b>${esc(t.inst)} · ${t.dir}</b><span>${CL[t.op].nombre}${cuentas().length>1?' · '+esc(cuentaDe(t.cuenta).nombre):''}${t.t?' · '+hora(t.t):''} · ${fmtR(Number(t.r)||0)}</span></div>
    ${f.length?`<span class="badge er">${f.length===1?esc(f[0]):f.length+' reglas rotas'}</span>`:`<span class="badge ok">${ico('check',14,3)} Plan cumplido</span>`}</div>`});
  return h+`</section>`}

function vTerminado(d,r){
  const ok=d.trades.filter(t=>!fallosTrade(t).length).length;
  const extra={stops:'Has llegado a tu máximo de stops.',panico:'Has pulsado el botón de pánico. Parar a tiempo también es operar bien.',sinsetup:'Sin setup no hay operación. Eso también es disciplina.',manual:''}[d.mode]||'';
  return `<section class="fin"><img src="${LOGO_FIN}" alt="BC Trades" class="logo-fin"><div class="ring"><div>${ico('candado',38,2)}</div></div>
  <div><h1>Has terminado tu día.</h1><p class="big">No operes más: mañana me lo agradecerás.</p>${extra?`<p class="small">${extra}</p>`:''}</div>
  <div class="stats3"><div><b>${d.trades.length}</b><span>${d.trades.length===1?'operación':'operaciones'}</span></div><div><b>${ok}/${d.trades.length}</b><span>plan cumplido</span></div><div><b>${r}</b><span>días de racha</span></div></div>
  <span class="pill">${ico('reloj',18)} Se desbloquea mañana</span>
  <button type="button" class="link" data-tab="informe">Ver el informe de la semana</button></section>`}

function vOperar(){
  const op=draft.op;const c=op?CL[op]:null;const items=c?c.items.concat(comunes()):[];
  const done=items.filter((_,i)=>draft.checks[i]).length;const all=c&&done===items.length&&draft.inst&&draft.dir;
  let h=`<header class="back"><button type="button" class="ib" data-act="volver" aria-label="Volver a Hoy">${ico('atras',24)}</button><div><h1 class="h2">Checklist de entrada</h1><p class="sub">Antes de pulsar, cumple todas</p></div></header>
  <div class="seg" role="group" aria-label="Operativa"><button type="button" data-op="familia" aria-pressed="${op==='familia'}" class="${op==='familia'?'on':''}">Operativa de la familia</button><button type="button" data-op="objetivo" aria-pressed="${op==='objetivo'}" class="${op==='objetivo'?'on':''}">Operativa del objetivo</button></div>`;
  const cs=cuentas();if(!draft.cuenta||!cs.some(x=>x.id===draft.cuenta))draft.cuenta=cs[0].id;

    h+=`<button type="button" class="item ${on?'on':''}" data-chk="${i}" aria-pressed="${on}"><span class="box">${on?ico('check',16,3):''}</span><span>${it}</span></button>`});

  <section class="card"><h2>Dónde más te equivocas</h2>`;

/* ---------- Escudos e insignias ---------- */
const INSIGNIAS=[
 {id:'primer',n:'Primer día limpio',d:'Cierra un día cumpliendo el plan',f:s=>s.limpios,m:1},
 {id:'semana',n:'Semana perfecta',d:'5 días limpios de lunes a viernes',f:s=>s.mejorSemana,m:5},
 {id:'franco',n:'Paciencia de francotirador',d:'5 días sin setup y sin operar',f:s=>s.sinsetup,m:5},
 {id:'parar',n:'Sabe parar',d:'Usa el botón de pánico 3 veces',f:s=>s.panico,m:3},
 {id:'promedio',n:'Cero promedios',d:'20 operaciones sin promediar',f:s=>s.sinProm,m:20},
 {id:'stop',n:'Stop sagrado',d:'30 operaciones sin mover el stop',f:s=>s.stopOk,m:30},
 {id:'checklist',n:'Maestro del checklist',d:'50 operaciones con el checklist al 100 %',f:s=>s.chkOk,m:50},
 {id:'racha30',n:'Racha de 30',d:'30 días seguidos cumpliendo el plan',f:s=>s.record,m:30}];
function lunesDe(k){const d=new Date(k+'T12:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return d}
function statsLogros(){const s={limpios:0,sinsetup:0,stopOk:0,sinProm:0,chkOk:0,panico:0,record:S.record||0,mejorSemana:0};const sem={};
  Object.keys(S.days).forEach(k=>{const d=S.days[k];const e=estadoDia(k);
    if(e==='limpio'){s.limpios++;const w=dkey(lunesDe(k));sem[w]=(sem[w]||0)+1;if(d.mode==='sinsetup')s.sinsetup++}
    if(d.mode==='panico')s.panico++;
    d.trades.forEach(t=>{if(!t.movioStop)s.stopOk++;if(!t.promedio)s.sinProm++;if(t.checklistOk)s.chkOk++})});
  s.mejorSemana=Math.max(0,...Object.values(sem));return s}
function rachaAntes(k){let n=0;const d=new Date(k+'T12:00:00');d.setDate(d.getDate()-1);
  for(let i=0;i<60;i++){const wd=d.getDay(),kk=dkey(d);if(wd!==0&&wd!==6){if(estadoDia(kk)==='limpio')n++;else if(!(S.protegidos||[]).includes(kk))break}d.setDate(d.getDate()-1)}return n}
function actualizarLogros(){let cambio=false;
  if(!S.insignias){S.insignias={};cambio=true}if(S.escudos==null){S.escudos=0;cambio=true}if(!S.protegidos){S.protegidos=[];cambio=true}
  const d=new Date();d.setDate(d.getDate()-1);while(d.getDay()===0||d.getDay()===6)d.setDate(d.getDate()-1);
  const ay=dkey(d),eAy=estadoDia(ay);
  if(eAy!=='limpio'&&!S.protegidos.includes(ay)&&S.escudos>0&&rachaAntes(ay)>0){S.escudos--;S.protegidos.push(ay);cambio=true;toast('Escudo de racha usado: tu racha sigue viva')}
  const r=racha();if(r>(S.record||0)){S.record=r;cambio=true}
  if(S.hito==null||r<S.hito){S.hito=r;cambio=true}
  if(Math.floor(r/7)>Math.floor(S.hito/7)){S.hito=r;cambio=true;if(S.escudos<2){S.escudos++;setTimeout(()=>toast('Has ganado un escudo de racha'),900)}}
  const st=statsLogros();let j=0;
  INSIGNIAS.forEach(b=>{if(!S.insignias[b.id]&&b.f(st)>=b.m){S.insignias[b.id]=today();cambio=true;setTimeout(()=>toast('Insignia desbloqueada: '+b.n),1800+1800*j++)}});
  if(cambio)save()}

  window.scrollTo(0,0);
  requestAnimationFrame(()=>{const n=document.querySelector('nav');if(n)document.documentElement.style.setProperty('--navh',n.offsetHeight+'px')})}
const num=v=>Number(String(v==null?'':v).replace(/[\s%R]/gi,'').replace(/[\u2212\u2013]/g,'-').replace(',','.').replace(/^\+/,''));
function faltaCierre(){const f=[];if(tmp.riesgo===''||isNaN(num(tmp.riesgo)))f.push('el riesgo');if(tmp.r===''||isNaN(num(tmp.r)))f.push('el resultado en R');
  [['promedio','si promediaste'],['movioStop','si moviste el stop'],['checklistOk','si cumpliste el checklist'],['captura','si guardaste la captura']].forEach(([k,t])=>{if(typeof tmp[k]!=='boolean')f.push(t)});
  return 'Falta: '+f.join(', ')}
function faltaEntrada(){const c=CL[draft.op];if(!c)return 'Elige primero la operativa';const n=c.items.length+comunes().length;let x=0;for(let i=0;i<n;i++)if(!draft.checks[i])x++;
  if(x)return 'Faltan '+x+' condiciones por cumplir';if(!(draft.inst||'').trim())return 'Indica el instrumento';return 'Elige compra o venta'}
async function rellenarNombres(){document.querySelectorAll('[data-uid]').forEach(e=>{if(!e.dataset.alias){e.textContent='Trader sin nombre';const av=document.querySelector('[data-ini="'+CSS.escape(e.dataset.uid)+'"]');if(av)av.textContent='?'}})}
function leerAjustes(){const g=id=>document.getElementById(id);if(!g('sNombre'))return;
  S.settings.nombre=g('sNombre').value.trim().slice(0,24);
  S.settings.stopsMax=Math.max(1,Math.round(num(g('sStops').value)||2));
  cuentas().forEach(c=>{const n=g('cn_'+c.id),r=g('cr_'+c.id);if(n)c.nombre=n.value.trim().slice(0,20)||c.nombre;if(r)c.riesgo=Math.max(0.01,num(r.value)||c.riesgo)});
  S.settings.riesgoMax=cuentas()[0].riesgo}
function listoCierre(){return tmp.riesgo!==''&&tmp.r!==''&&!isNaN(num(tmp.riesgo))&&!isNaN(num(tmp.r))&&[tmp.promedio,tmp.movioStop,tmp.checklistOk,tmp.captura].every(v=>typeof v==='boolean')}
function readCierre(){const g=id=>{const el=document.getElementById(id);return el?el.value:null};
  const r=g('riesgo'),l=g('lotes'),rr=g('rr');if(r!==null)tmp.riesgo=r;if(l!==null)tmp.lotes=l;if(rr!==null)tmp.r=rr}
function entradaLista(){const c=CL[draft.op];if(!c)return false;const n=c.items.length+comunes().length;for(let i=0;i<n;i++)if(!draft.checks[i])return false;return !!((draft.inst||'').trim()&&draft.dir)}

function confirmar(titulo,texto,ok,peligro,fn){
  const prev=document.getElementById('modal');if(prev)prev.remove();
  const m=document.createElement('div');m.id='modal';m.className='modal';
  m.innerHTML=`<div class="mbox" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">${titulo}</h2><p>${texto}</p><div class="mbtns"><button type="button" class="btn sec" id="mNo">Cancelar</button><button type="button" class="btn ${peligro?'panic':'primary'}" id="mOk">${ok}</button></div></div>`;
  document.body.appendChild(m);
  const cerrar=()=>m.remove();
  m.querySelector('#mNo').onclick=e=>{e.stopPropagation();cerrar()};
  m.querySelector('#mOk').onclick=e=>{e.stopPropagation();cerrar();fn()};
  m.onclick=e=>{if(e.target===m)cerrar()};
  m.querySelector('#mNo').focus()}

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.tab){const tb=b.dataset.tab;
    if(tb==='entrada'){const d=S.days[today()];
      if(d&&d.closed){view='hoy';render();toast('Tu día está cerrado. Mañana más.');return}
      if(S.open){if(view!=='cierre')tmp={riesgo:'',lotes:'',r:'',promedio:null,movioStop:null,checklistOk:null,captura:null,fallos:[]};view='cierre'}
      else{if(view!=='operar')draft={};view='operar'}}
    else view=tb;
    if(tb==='liga'&&DB)cargarLiga().then(()=>{if(view==='liga')render()}).catch(()=>{});
    render();return}
  if(b.dataset.op){const inst=draft.inst||'',dir=draft.dir||'';draft={op:b.dataset.op,checks:{},inst,dir};render();return}
  if(b.dataset.chk!==undefined){draft.inst=(document.getElementById('inst')||{}).value||draft.inst;draft.checks[b.dataset.chk]=!draft.checks[b.dataset.chk];const y=window.scrollY;render();window.scrollTo(0,y);return}
  if(b.dataset.dir){draft.inst=(document.getElementById('inst')||{}).value||draft.inst;draft.dir=b.dataset.dir;const y=window.scrollY;render();window.scrollTo(0,y);return}
  if(b.dataset.cta){draft.inst=(document.getElementById('inst')||{}).value||draft.inst;draft.cuenta=b.dataset.cta;const y=window.scrollY;render();window.scrollTo(0,y);return}
  if(b.dataset.tipo){leerAjustes();const [id,tp]=b.dataset.tipo.split('|');const c=cuentas().find(x=>x.id===id);if(c)c.tipo=tp;save();const y=window.scrollY;render();window.scrollTo(0,y);return}
  if(b.dataset.del){leerAjustes();const id=b.dataset.del;const c=cuentaDe(id);confirmar('¿Quitar '+esc(c.nombre)+'?','Las operaciones ya registradas en esta cuenta se mantienen en tu historial.','Quitar cuenta',true,()=>{S.settings.cuentas=cuentas().filter(x=>x.id!==id);save();render()});return}
  if(b.dataset.sem){semana=Number(b.dataset.sem);render();return}
  if(b.dataset.yn){readCierre();tmp[b.dataset.yn]=b.dataset.v==='1';if(b.dataset.yn==='checklistOk'&&tmp.checklistOk)tmp.fallos=[];const y=window.scrollY;render();window.scrollTo(0,y);return}
  if(b.dataset.fallo){readCierre();const i=Number(b.dataset.fallo);tmp.fallos=tmp.fallos.includes(i)?tmp.fallos.filter(x=>x!==i):tmp.fallos.concat(i);const y=window.scrollY;render();window.scrollTo(0,y);return}
  const a=b.dataset.act;if(!a)return;
  if(a==='login'||a==='registro'){b.disabled=true;login(a).finally(()=>{b.disabled=false});return}
  if(a==='cambiarLogin'){modoLogin=modoLogin==='login'?'registro':'login';render();return}
  if(a==='salir'){confirmar('¿Cerrar sesión?','Tus datos quedan guardados en tu cuenta. Podrás volver a entrar con tu email y contraseña.','Cerrar sesión',false,salir);return}
  if(a==='operar'){draft={};view='operar'}
  else if(a==='volver'){view='hoy'}
  else if(a==='entrar'){if(!entradaLista()){toast(faltaEntrada());return}S.open={op:draft.op,cuenta:draft.cuenta,inst:draft.inst.trim(),dir:draft.dir,t:Date.now()};save();view='hoy';toast('Entrada registrada. Ahora, a respetar el plan.')}
  else if(a==='cerrarOp'){tmp={riesgo:'',lotes:'',r:'',promedio:null,movioStop:null,checklistOk:null,captura:null,fallos:[]};view='cierre'}
  else if(a==='guardarCierre'){readCierre();if(!listoCierre()){toast(faltaCierre());return}const o=S.open;
    const t={op:o.op,cuenta:o.cuenta,inst:o.inst,dir:o.dir,riesgo:num(tmp.riesgo),lotes:num(tmp.lotes)||0,r:num(tmp.r),promedio:tmp.promedio,movioStop:tmp.movioStop,checklistOk:tmp.checklistOk,captura:tmp.captura,fallos:tmp.fallos,t:Date.now()};
    day().trades.push(t);S.open=null;save();
    const f=fallosTrade(t);addXP((t.movioStop?0:5)+(t.captura?3:0)-10*f.length,f.length?f.length+(f.length>1?' reglas rotas':' regla rota'):'Plan cumplido');
    view='hoy';
    if(day().trades.filter(x=>x.r<0).length>=S.settings.stopsMax){cerrarDia('stops');return}}
  else if(a==='descartar'){confirmar('¿Anular esta entrada?','Úsalo solo si no llegaste a ejecutar la operación. No contará en tu racha ni en el informe.','Anular la entrada',true,()=>{S.open=null;save();view='hoy';toast('Entrada anulada');render()});return}
  else if(a==='cerrarDia'){cerrarDia('manual');return}
  else if(a==='sinSetup'){cerrarDia('sinsetup');return}
  else if(a==='panico'){confirmar('¿Cerrar el día ahora?','Si notas ansiedad, ganas de recuperar o de forzar una entrada, para aquí. No podrás registrar más operaciones hasta mañana y ganas +15 XP.','Cerrar mi día',true,()=>cerrarDia('panico'));return}
  else if(a==='guardarAjustes'){leerAjustes();save();toast('Ajustes guardados')}
  else if(a==='addCuenta'){leerAjustes();const cs=cuentas();if(cs.length<5)cs.push({id:'c'+Date.now().toString(36),nombre:'Cuenta '+(cs.length+1),tipo:'fondeo',riesgo:0.5});save()}
  else if(a==='borrar'){confirmar('¿Borrar todos los datos?','Se borrarán tu racha, tu XP, tus insignias y todas tus operaciones. No se puede deshacer.','Borrar todo',true,()=>{S=normaliza(null);save();toast('Datos borrados');render()});return}
  render()});

document.addEventListener('input',e=>{
  if(e.target.id==='inst'){draft.inst=e.target.value;const btn=document.querySelector('[data-act="entrar"]');if(btn)btn.classList.toggle('off',!entradaLista())}
  if(['riesgo','lotes','rr'].includes(e.target.id)){readCierre();
    const w=document.getElementById('warnS');const sobre=S.open&&num(tmp.riesgo)>cuentaDe(S.open.cuenta).riesgo;if(w)w.hidden=!sobre;
    const btn=document.querySelector('[data-act="guardarCierre"]');if(btn)btn.classList.toggle('off',!listoCierre())}});

render();
initNube();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
